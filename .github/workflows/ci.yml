name: Build and validate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check the exact revision before starting platform builds
        run: |
          python3 tools/check_revision.py HEAD
          python3 tools/check.py --sources-only

  build:
    needs: sources
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET: ${{ matrix.target }}
      NUMPROC: 4
    strategy:
      fail-fast: false
      matrix:
        target: [linux-x86_64, linux-aarch64, linux-riscv64, windows-x86_64, android-arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enable bounded build and test scopes
        run: |
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm python3 gcc-aarch64-linux-gnu g++-aarch64-linux-gnu gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
      - name: Install and exercise the RISC-V toolchain
        if: matrix.target == 'linux-riscv64'
        run: |
          sudo apt-get install -y gcc-riscv64-linux-gnu g++-riscv64-linux-gnu qemu-user
          python3 tools/run_guarded.py --memory-mib 1024 --seconds 180 -- python3 tools/test_riscv64.py
      - name: Install Android NDK
        if: matrix.target == 'android-arm64'
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;26.3.11579264'
      - name: Check distribution and focused regression tests
        run: |
          python3 tools/run_guarded.py --memory-mib 1024 --seconds 180 -- make check
          python3 tools/run_guarded.py --memory-mib 1024 --seconds 180 -- python3 tools/test_historical_behavior.py
          python3 tools/run_guarded.py --memory-mib 512 --seconds 60 -- python3 tools/test_historical_level_runtime.py
          python3 tools/run_guarded.py --memory-mib 512 --seconds 60 -- python3 tools/test_historical_save_bonus.py
          python3 tools/run_guarded.py --memory-mib 512 --seconds 60 -- python3 tools/test_sprite_encoding.py
          python3 tools/run_guarded.py --memory-mib 512 --seconds 90 -- python3 tools/test_font_raster.py
          python3 tools/run_guarded.py --memory-mib 1024 --seconds 180 -- python3 tools/test_panel_order.py
          python3 tools/run_guarded.py --memory-mib 1024 --seconds 180 -- python3 tools/test_6392_profile.py
          python3 tools/run_guarded.py --memory-mib 512 --seconds 90 -- python3 tools/test_profile_identity.py
          python3 tools/run_guarded.py --memory-mib 512 --seconds 60 -- python3 tools/test_executable_build_tag.py
          python3 tools/run_guarded.py --memory-mib 1024 --seconds 180 -- python3 tools/test_branch_profiles.py
          python3 tools/run_guarded.py --memory-mib 1024 --seconds 180 -- python3 tools/test_profile_palettes.py
          python3 tools/run_guarded.py --memory-mib 1024 --seconds 180 -- python3 tools/test_early_v3_profiles.py
          python3 tools/run_guarded.py --memory-mib 1024 --seconds 180 -- python3 tools/test_property_error_lists.py
          python3 tools/run_guarded.py --memory-mib 1024 --seconds 180 -- python3 tools/test_text_object_ownership.py
          python3 tools/run_guarded.py --memory-mib 1024 --seconds 180 -- python3 tools/test_content_triage.py
      - name: Build and package
        run: |
          case "$TARGET" in
            linux-*) export GLIBC_MAX=2.38 ;;
          esac
          if [ "$TARGET" = android-arm64 ]; then
            export ANDROID_NDK="$ANDROID_HOME/ndk/26.3.11579264"
          fi
          python3 tools/run_guarded.py --memory-mib 6144 --seconds 1800 -- make TARGET="$TARGET" release
      - name: Inspect the built core (format, architecture, dependencies, exports)
        run: |
          case "$TARGET" in
            linux-*)   python3 tools/check.py --target "$TARGET" --binary anybor_libretro.so ;;
            windows-*) python3 tools/check.py --target "$TARGET" --binary anybor_libretro.dll ;;
            android-*) python3 tools/check.py --target "$TARGET" --binary anybor_libretro_android.so ;;
            *) echo "Unknown or missing TARGET: $TARGET" >&2; exit 1 ;;
          esac
      - name: Exercise native runtime regressions
        if: matrix.target == 'linux-x86_64'
        run: |
          sudo apt-get install -y ffmpeg
          python3 tools/run_guarded.py --memory-mib 2048 --seconds 900 -- python3 tools/smoke.py
          python3 tools/run_guarded.py --memory-mib 2048 --seconds 900 -- python3 tools/regression.py --webm
          python3 tools/run_guarded.py --memory-mib 2048 --seconds 900 -- python3 tools/test_multiplayer.py
          python3 tools/run_guarded.py --memory-mib 2048 --seconds 900 -- python3 tools/test_crt.py
          python3 tools/run_guarded.py --memory-mib 2048 --seconds 300 -- python3 tools/test_geometry.py --core anybor_libretro.so
          python3 tools/run_guarded.py --memory-mib 2048 --seconds 300 -- python3 tools/test_4453.py --core anybor_libretro.so
          python3 tools/run_guarded.py --memory-mib 2048 --seconds 300 -- python3 tools/test_6330_6510.py --core anybor_libretro.so
          python3 tools/run_guarded.py --memory-mib 2048 --seconds 180 -- python3 tools/test_animation_scripts.py --core anybor_libretro.so
          python3 tools/run_guarded.py --memory-mib 1024 --seconds 180 -- python3 tools/test_script_timestamps.py
          python3 tools/run_guarded.py --memory-mib 1024 --seconds 180 -- python3 tools/test_native_io.py
          python3 tools/run_guarded.py --memory-mib 1024 --seconds 180 -- python3 tools/test_write_watch.py
      - name: Exercise RISC-V fixed-base states under user emulation
        if: matrix.target == 'linux-riscv64'
        run: |
          python3 tools/run_guarded.py --memory-mib 2048 --seconds 600 -- python3 tools/test_riscv64.py --core anybor_libretro.so
      - name: Boot every Windows engine with fresh and existing saves
        if: matrix.target == 'windows-x86_64'
        env:
          WINEPREFIX: ${{ runner.temp }}/anybor-wine
          WINEDEBUG: '-all'
        run: |
          sudo apt-get install -y wine64 wine
          python3 tools/run_guarded.py --memory-mib 1024 --seconds 180 -- python3 tools/test_windows_workers.py
          python3 tools/run_guarded.py --memory-mib 2048 --seconds 900 -- python3 tools/smoke.py --core anybor_libretro.dll --windows --runner wine
          python3 tools/run_guarded.py --memory-mib 2048 --seconds 300 -- python3 tools/test_geometry.py --core anybor_libretro.dll --windows --runner wine
      - uses: actions/upload-artifact@v4
        with:
          name: anybor-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

  macos:
    needs: sources
    timeout-minutes: 30
    # Native Intel and Apple Silicon builds.  Both labels are GitHub-hosted
    # runner images: macos-15-intel is the x64 image and macos-15 the arm64
    # one.  The build and inspection steps mirror what libretro's osx-x64 and
    # osx-arm64 CI templates do (platform=osx, clang, dylib artifact, lipo
    # architecture check) and add the runtime checks this source tree ships.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: macos-x86_64
            arch: x86_64
          - runner: macos-15
            target: macos-arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
      NUMPROC: 4
      ANYBOR_TEST_EVIDENCE_DIR: .build/native-test-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Report toolchain
        run: |
          clang --version
          xcodebuild -version || true
          python3 --version
      - name: Install x86 assembler
        if: matrix.arch == 'x86_64'
        run: command -v nasm || brew install nasm
      - name: Build, check and package
        run: make TARGET="$TARGET" release
      - name: Inspect format, architecture, dependencies and exports
        run: |
          python3 tools/check.py --target "$TARGET" --binary anybor_libretro.dylib
          lipo -info anybor_libretro.dylib
          otool -l anybor_libretro.dylib | grep -A4 'LC_BUILD_VERSION' || true
          otool -L anybor_libretro.dylib
          if [ "$(lipo -info anybor_libretro.dylib | grep -c '${{ matrix.arch }}')" = 0 ]; then
            echo "wrong architecture in the built dylib"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anybor-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.zip.sha256
            .build/native-test-evidence/
            .build/dist/${{ matrix.target }}/anybor_libretro.dylib.sym
            .build/dist/${{ matrix.target }}/link.map
          include-hidden-files: true
          if-no-files-found: error

  macos-regressions:
    needs: macos
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: macos-x86_64
          - runner: macos-15
            target: macos-arm64
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
      ANYBOR_TEST_EVIDENCE_DIR: .build/native-test-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: anybor-${{ matrix.target }}
          path: .build/ci-package
      - name: Verify and unpack the exact built core
        run: python3 tools/unpack_ci_core.py --target "$TARGET"
      - name: Exercise native runtime regressions
        run: |
          python3 tools/test_historical_behavior.py
          python3 tools/test_historical_level_runtime.py
          python3 tools/test_historical_save_bonus.py
          python3 tools/test_sprite_encoding.py
          python3 tools/test_font_raster.py
          python3 tools/test_panel_order.py
          python3 tools/test_6392_profile.py
          python3 tools/test_profile_identity.py
          python3 tools/test_executable_build_tag.py
          python3 tools/test_branch_profiles.py
          python3 tools/test_profile_palettes.py
          python3 tools/test_early_v3_profiles.py
          python3 tools/test_property_error_lists.py
          python3 tools/test_text_object_ownership.py
          python3 tools/test_content_triage.py
          python3 tools/test_write_watch.py
          python3 tools/smoke.py --core anybor_libretro.dylib
          python3 tools/regression.py --core anybor_libretro.dylib
          python3 tools/test_multiplayer.py --core anybor_libretro.dylib
          python3 tools/test_crt.py --core anybor_libretro.dylib
          python3 tools/test_geometry.py --core anybor_libretro.dylib
          python3 tools/test_4453.py --core anybor_libretro.dylib
          python3 tools/test_6330_6510.py --core anybor_libretro.dylib
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anybor-macos-regressions-evidence-${{ matrix.target }}
          path: .build/native-test-evidence/
          include-hidden-files: true
          if-no-files-found: warn

  state-linux:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        profile_group: ["1/5", "2/5", "3/5", "4/5", "5/5"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: anybor-linux-x86_64
          path: .build/ci-package
      - name: Verify and unpack the exact built core
        run: python3 tools/unpack_ci_core.py --target linux-x86_64
      - name: Enable bounded test scopes
        run: |
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Exercise grouped Linux rewind contracts
        run: |
          python3 tools/run_guarded.py --memory-mib 2048 --seconds 900 -- python3 tools/test_rewind.py --work-parent /var/tmp --profile-group '${{ matrix.profile_group }}'
      - name: Exercise grouped Linux state options
        run: |
          python3 tools/run_guarded.py --memory-mib 2048 --seconds 900 -- python3 tools/test_state_options.py --work-parent /var/tmp --profile-group '${{ matrix.profile_group }}'

  state-windows:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        profile_group: ["1/5", "2/5", "3/5", "4/5", "5/5"]
    env:
      WINEDEBUG: '-all'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: anybor-windows-x86_64
          path: .build/ci-package
      - name: Verify and unpack the exact built core
        run: python3 tools/unpack_ci_core.py --target windows-x86_64
      - name: Install Wine and test host compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y wine64 wine gcc-mingw-w64-x86-64
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Exercise grouped Windows rewind contracts
        run: |
          python3 tools/run_guarded.py --memory-mib 2048 --seconds 900 -- python3 tools/test_rewind.py --core anybor_libretro.dll --windows --runner wine --keep-wine-server --work-parent /var/tmp --profile-group '${{ matrix.profile_group }}'
      - name: Exercise grouped Windows state options
        run: |
          python3 tools/run_guarded.py --memory-mib 2048 --seconds 900 -- python3 tools/test_state_options.py --core anybor_libretro.dll --windows --runner wine --keep-wine-server --work-parent /var/tmp --profile-group '${{ matrix.profile_group }}'

  state-macos:
    needs: macos
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        profile_group: ["1/5", "2/5", "3/5", "4/5", "5/5"]
        platform:
          - runner: macos-15-intel
            target: macos-x86_64
          - runner: macos-15
            target: macos-arm64
    env:
      ANYBOR_TEST_EVIDENCE_DIR: .build/native-test-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: anybor-${{ matrix.platform.target }}
          path: .build/ci-package
      - name: Verify and unpack the exact built core
        run: python3 tools/unpack_ci_core.py --target "${{ matrix.platform.target }}"
      - name: Exercise grouped macOS rewind contracts
        run: |
          python3 tools/test_rewind.py --core anybor_libretro.dylib --work-parent /var/tmp --profile-group '${{ matrix.profile_group }}'
      - name: Exercise grouped macOS state options
        run: |
          python3 tools/test_state_options.py --core anybor_libretro.dylib --work-parent /var/tmp --profile-group '${{ matrix.profile_group }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anybor-state-evidence-${{ matrix.platform.target }}-${{ strategy.job-index }}
          path: .build/native-test-evidence/
          include-hidden-files: true
          if-no-files-found: warn
