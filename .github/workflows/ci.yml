          python3 tools/run_guarded.py --memory-mib 512 --seconds 180 -- python3 tools/test_sprite_queue.py
          python3 tools/run_guarded.py --memory-mib 512 --seconds 180 -- python3 tools/test_sprite_queue_loading.py
