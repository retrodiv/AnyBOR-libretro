name: Build and validate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check the exact revision before starting platform builds
        run: |
          python3 tools/check_revision.py HEAD
          python3 tools/check.py --sources-only

  build:
    needs: sources
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET: ${{ matrix.target }}
      NUMPROC: 4
    strategy:
      fail-fast: false
      matrix:
        target: [linux-x86_64, linux-aarch64, linux-riscv64, windows-x86_64, android-arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enable bounded build and test scopes
        run: |
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm python3 pkg-config libpng-dev gcc-aarch64-linux-gnu g++-aarch64-linux-gnu gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
      - name: Install and exercise the RISC-V toolchain
        if: matrix.target == 'linux-riscv64'
        run: |
          sudo apt-get install -y gcc-riscv64-linux-gnu g++-riscv64-linux-gnu qemu-user
          python3 tools/run_guarded.py --memory-mib 1024 --seconds 180 -- python3 tools/test_riscv64.py
      - name: Install Android NDK
        if: matrix.target == 'android-arm64'
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;26.3.11579264'
      - name: Check distribution and focused regression tests
        run: |
          python3 tools/run_guarded.py --memory-mib 1024 --seconds 180 -- make check
          python3 tools/run_guarded.py --memory-mib 512 --seconds 60 -- python3 tools/test_ci_regressions.py
          python3 tools/run_guarded.py --memory-mib 512 --seconds 60 -- python3 tools/test_native_sanitizers.py
          python3 tools/run_guarded.py --memory-mib 1024 --seconds 180 -- python3 tools/test_historical_behavior.py
          python3 tools/run_guarded.py --memory-mib 512 --seconds 120 -- python3 tools/test_historical_player_domains.py
          python3 tools/run_guarded.py --memory-mib 512 --seconds 120 -- python3 tools/test_historical_entity_colourmaps.py
          python3 tools/run_guarded.py --memory-mib 512 --seconds 120 -- python3 tools/test_historical_entity_factors.py
          python3 tools/run_guarded.py --memory-mib 512 --seconds 120 -- python3 tools/test_historical_entity_returns.py
          python3 tools/run_guarded.py --memory-mib 512 --seconds 120 -- python3 tools/test_historical_entity_complex.py
          python3 tools/run_guarded.py --memory-mib 512 --seconds 120 -- python3 tools/test_historical_entity_domains.py
          python3 tools/run_guarded.py --memory-mib 512 --seconds 120 -- python3 tools/test_historical_entity_mapper_split.py
          python3 tools/run_guarded.py --memory-mib 512 --seconds 120 -- python3 tools/test_historical_entity_factor_reads.py
          python3 tools/run_guarded.py --memory-mib 512 --seconds 120 -- python3 tools/test_historical_sprite_stats_reads.py
          python3 tools/run_guarded.py --memory-mib 512 --seconds 120 -- python3 tools/test_historical_stats_writes.py
          python3 tools/run_guarded.py --memory-mib 512 --seconds 120 -- python3 tools/test_historical_script_ownership.py
          python3 tools/run_guarded.py --memory-mib 512 --seconds 120 -- python3 tools/test_historical_script_callbacks.py
