# Libretro infrastructure entry points; 64-bit shared-library targets only.
.core-defs:
  variables:
    CORENAME: anybor
    MAKEFILE: Makefile
    MAKEFILE_PATH: .
    STRIP_CORE_LIB: 0

include:
  - project: libretro-infrastructure/ci-templates
    file: /linux-x64.yml
  - project: libretro-infrastructure/ci-templates
    file: /linux-aarch64.yml
  - project: libretro-infrastructure/ci-templates
    file: /windows-x64-mingw.yml
  - project: libretro-infrastructure/ci-templates
    file: /android-jni.yml
  - project: libretro-infrastructure/ci-templates
    file: /osx-x64.yml
  - project: libretro-infrastructure/ci-templates
    file: /osx-arm64.yml

stages:
  - build-shared

libretro-build-linux-x64:
  extends:
    - .libretro-linux-x64-make-default
    - .core-defs
  artifacts:
    paths:
      - anybor_libretro.so
      - anybor_libretro.info
      - NOTICE.txt
      - LICENSES/

libretro-build-linux-aarch64:
  extends:
    - .libretro-linux-aarch64-make-default
    - .core-defs
  artifacts:
    paths:
      - anybor_libretro.so
      - anybor_libretro.info
      - NOTICE.txt
      - LICENSES/

libretro-build-windows-x64:
  extends:
    - .libretro-windows-x64-mingw-make-default
    - .core-defs
  artifacts:
    paths:
      - anybor_libretro.dll
      - anybor_libretro.info
      - NOTICE.txt
      - LICENSES/

libretro-build-android-arm64:
  extends:
    - .libretro-android-jni-arm64-v8a
    - .core-defs
  artifacts:
    paths:
      - anybor_libretro_android.so
      - anybor_libretro.info
      - NOTICE.txt
      - LICENSES/

# Both jobs run the repository's default make target with platform=osx, which
# Makefile + tools/build.py resolve to macos-x86_64 or macos-arm64 from the
# compiler triple.  osx-arm64 additionally exports LIBRETRO_APPLE_PLATFORM /
# LIBRETRO_APPLE_ISYSROOT, which the build honors as cross-compilation flags.
libretro-build-osx-x64:
  extends:
    - .libretro-osx-x64-make-default
    - .core-defs
  artifacts:
    paths:
      - anybor_libretro.dylib
      - anybor_libretro.info
      - NOTICE.txt
      - LICENSES/

libretro-build-osx-arm64:
  extends:
    - .libretro-osx-arm64-make-default
    - .core-defs
  artifacts:
    paths:
      - anybor_libretro.dylib
      - anybor_libretro.info
      - NOTICE.txt
      - LICENSES/
