# Buffer adapters for caller-authored archive representations.
# Copy to AnyBOR.ini in the frontend system directory and rename exactly one
# entry key to input. As supplied, this file selects no function.
# See docs/CONTENT_TRANSFORMS.md for sample inputs and each layout's bounds.

[transforms]
copy_payload = buffer copy_archive() {
    return slice(0, input_size);
}

header_payload = buffer remove_sized_header() {
    // First little-endian u32: complete header size, including that word.
    if (input_size < 4) reject();
    uint64_t start = read32(input, 0);
    if (start < 4 || start > input_size) reject();
    return slice(start, input_size - start);
}

range_payload = buffer extract_archive_range() {
    // Two little-endian u32 values: absolute offset and byte length.
    if (input_size < 8) reject();
    uint64_t start = read32(input, 0);
    uint64_t length = read32(input, 4);
    if (start < 8 || start > input_size || length == 0) reject();
    if (length > input_size - start) reject();
    return slice(start, length);
}

little_endian_words = buffer restore_word_order() {
    // Reverse complete words. A partial final word keeps its byte order.
    for (uint64_t offset = 0; input_size - offset >= 4; offset += 4) {
        uint64_t word = read32(input, offset);
        uint64_t reversed = ((word & 255) << 24) |
                            ((word & 65280) << 8) |
                            ((word >> 8) & 65280) |
                            ((word >> 24) & 255);
        write32(work, offset, reversed);
    }
    return slice(0, input_size);
}
